name: Release

# Weft's packages are versioned and released together, so a `v*` tag names the whole
# release. `pnpm version:set <version>` moves every manifest; the tag has to agree with
# them or the publish stops before it reaches the registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance attestation
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Configure git identity
        run: |
          git config --global user.name "weft-ci"
          git config --global user.email "ci@weft.invalid"
          git config --global init.defaultBranch main

      - run: pnpm install --frozen-lockfile

      - name: Tag must match every package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const want = process.env.TAG.replace(/^v/, "");
            const bad = [];
            const check = (f) => {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.version !== want) bad.push(`  ${f}: ${pkg.version}`);
            };
            check("package.json");
            for (const d of fs.readdirSync("packages")) check(`packages/${d}/package.json`);
            if (bad.length) {
              console.error(`tag ${process.env.TAG} expects version ${want}, but:\n${bad.join("\n")}`);
              console.error("\nrun `pnpm version:set " + want + "`, commit, and retag");
              process.exit(1);
            }
            console.log(`tag ${process.env.TAG} matches all ${fs.readdirSync("packages").length + 1} manifests`);
          '

      # The same gates CI runs on every push. A release does not get a shorter path.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sync:meta --check
      - run: pnpm build

      # Catches the silent packaging failures: source-pointing exports, an unrewritten
      # `workspace:*`, a bin that is not in `files`, a package with no build output.
      - run: pnpm verify:packing

      # Installs the tarballs for real and drives the CLI and the MCP server out of that
      # install — the last thing between here and the registry.
      - run: pnpm verify:install

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        env:
          NPM_CONFIG_PROVENANCE: true
        # pnpm skips any package whose version is already on the registry, so re-running a
        # release after a partial failure publishes only what is missing.
        run: pnpm -r publish --access public --no-git-checks

      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: pnpm -r publish --access public --no-git-checks --dry-run

  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
